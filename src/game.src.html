<script>
"use strict";
const PACK=JSON.parse(document.getElementById("pack").textContent);
const ATLAS=PACK.atlas;
/* ---------- util ---------- */
const $=(s,e=document)=>e.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ST=$('#stage'),SC=$('#screen'),OV=$('#ov'),WRAP=$('#wrap');
const IMG={};
const im=(c,n)=>IMG[c+'/'+n]||'';

function kick(){const c=AU.ctx;if(!c)return;try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}}
function wake(){
 const c=AU.ctx;
 if(c){
  if(c.state!=='running'){try{const p=c.resume();p&&p.catch&&p.catch(()=>{});}catch(e){}}
  if(AU.check){AU.check=false;kick();const t0=c.currentTime;setTimeout(()=>{if(AU.ctx===c&&(c.state!=='running'||c.currentTime<=t0)){mkCtx();AU.ctx.onstatechange=()=>{};decodeAll();}},400);}
 }

function objs(o,n,x=0){let h='<span class="objs">';for(let i=0;i<n;i++)h+=`<img src="${im('drill',o[0])}" class="${i>=n-x?'x':''}" alt="">`;return h+'</span>';}
function opts(ans,lo,hi,n,wide){
 const c=new Set([ans]),cand=[];
 for(const d of [1,-1,2,-2,3,-3,wide?10:4,wide?-10:-4])cand.push(ans+d);
 for(const v of shuffle(cand)){if(c.size>=n)break;if(v>=lo&&v<=hi)c.add(v);}
 let g=0;while(c.size<n&&g++<50){const v=rnd(Math.max(lo,ans-5),Math.min(hi,ans+5));c.add(v);}
 return shuffle([...c]).map(v=>({v,h:String(v)}));
}
const NJ=['ぜろ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
const nj=n=>{if(n<10)return NJ[n];const t=Math.floor(n/10),o=n%10;return (t>1?NJ[t]:'')+'じゅう'+(o?NJ[o]:'');};

function qNum(a,b,op,wide,two){const r=op==='+'?a+b:a-b;return Qn(`<div class="big">${a} ${op==='+'?'＋':'−'} ${b} = <em>?</em></div>`,`${nj(a)} ${op==='+'?'たす':'ひく'} ${nj(b)} わ?`,r,opts(r,0,40,two?2:3,wide),{kind:'calc',expl:`${nj(a)} ${op==='+'?'たす':'ひく'} ${nj(b)} わ ${nj(r)}`});}

function makeQ(mode,s){
 const r=Math.random();
 if(mode==='k'){
  if(s<=2)return r<.5?qTapCount(1,4,true):qCount(1,5,true);
  if(s<=3)return r<.45?qTapCount(2,5):r<.8?qNumPic(1,5):qDots(1,4);
  if(s<=6)return r<.25?qCount(3,10):r<.45?qCompare(1,10):r<.7?qNumPic(2,7):r<.85?qDots(2,6):qTapCount(4,8);
  if(s<=8)return r<.45?qAddPic(5,s<=7):r<.65?qCount(4,10):r<.85?qSplit(5,true):qDots(3,6);
  if(s<=10)return r<.5?qAddPic(7):r<.75?qCompare(3,10):qSplit(7,true);
  if(s<=15)return r<.45?qAddPic(10):r<.7?qSubPic(5):qSplit(r<.85?7:10,true);
  if(s<=20)return r<.35?qAddPic(10):r<.65?qSubPic(8):r<.85?qSubPic(10):qSplit(10,true);
  return pick([()=>qAdd(10),()=>qSub(10),()=>qSubPic(10),()=>qMiss(10),()=>qSplit(10,true)])();
 }
 if(s<=2)return qAdd(5,null,true);
 if(s<=4)return r<.7?qAdd(10):qSplit(5,true);
 if(s<=6)return r<.4?qAdd(10):r<.6?qSub(5):qSplit(10,true);
 if(s<=9)return r<.3?qAdd(10):r<.55?qSub(10):r<.8?qSplit(10,true):qTenEq();
 if(s<=13)return r<.3?qAdd(20,'nc'):r<.5?qSub(20,'nb'):r<.75?qTenEq():qCarryPic();
 if(s<=18)return r<.35?qCarryPic():r<.75?qAdd(20,'c'):r<.9?qAdd(10):qTenEq();
 if(s<=22)return r<.75?qSub(20,'b'):qSub(10);
 return pick([()=>qAdd(20,'c'),()=>qSub(20,'b'),q3,()=>qMiss(20),()=>qBig(20)])();
}
/* ---- 出題の ペース: やさしい もんだいから はじめる / とくいなら すこしずつ むずかしく / まちがえたら ちょっと あとで もういちど ---- */
function Pacer(){return{adj:0,streak:0,miss:0,n:0,retry:[],cur:null,
 next(mode,s){this.n++;this.retry.forEach(e=>e.due--);
  const e=this.retry.find(x=>x.due<=0);
  if(e){const q=Object.assign({},e.q,{choices:shuffle(e.q.choices),again:true});this.cur={q,e};return q;}
  let t=Math.max(1,Math.min(26,s+this.adj));if(this.n<=2)t=Math.max(1,t-4);
  const q=makeQ(mode,t);q.tier=t;this.cur={q,e:null};return q;},
 done(first){const c=this.cur;if(!c)return;
  if(c.e){if(first)this.retry=this.retry.filter(x=>x!==c.e);else{c.e.due=4;if(++c.e.times>=2)this.retry=this.retry.filter(x=>x!==c.e);}return;}
  if(first){this.miss=0;if(++this.streak>=3){this.streak=0;this.adj=Math.min(3,this.adj+1);}}
  else{this.streak=0;if(this.retry.length<3)this.retry.push({q:c.q,due:3,times:0});if(++this.miss>=2){this.miss=0;this.adj=Math.max(-6,this.adj-1);}}}};}

  ['てき',()=>ENEMY.map(e=>[S.ze[e[0]],'enemies',e[0],e[1]])],
  ['どうぐ',()=>[...WEAP.map(x=>[S.weapons[x[0]],'items',x[0],x[1]]),...ARM.map(x=>[S.armors[x[0]],'items',x[0],x[1]]),...CHARM.map(x=>[S.charms[x[0]],'items',x[0],x[1]])]],
  ['ステッカー',()=>STK.map(x=>[S.stickers[x[0]],'stickers',x[0],x[1]])]
 ];
 let cur=0;
 const draw=()=>{const items=defs[cur][1]();const got=items.filter(x=>x[0]).length;
  tabs.innerHTML='';defs.forEach((d,i)=>{const b=el('button','tab'+(i===cur?' on':''),d[0]);b.onclick=()=>{sfx('tap');cur=i;draw();};tabs.append(b);});
  grid.innerHTML='';items.forEach((x,i)=>{const c=el('button','zc'+(x[0]?'':' un'));c.innerHTML=`<span class="no">${i+1}</span>${sp(x[1],x[2])}<div>${x[0]?x[3]:'？？？'}</div>`;c.onclick=()=>{if(x[0]){sfx('cursor_a');speak(x[3]);}};grid.append(c);});
  const cnt=el('div','chip',`<b>${got}</b> / ${items.length}`);cnt.style.cssText='position:absolute;right:24px;top:22px';s.append(cnt);if(s._c)s._c.remove();s._c=cnt;};
 draw();
};
/* ---------- boot ---------- */
async function boot(){
 const lbi=$('#lbi'),msg=$('#lmsg');let done=0;const total=Object.keys(ATLAS).length;
 const tick=()=>{done++;lbi.style.width=Math.min(100,done/total*100)+'%';};
 await loadSavedSound();
 AU.el=new Audio();AU.el.preload='auto';AU.blobTried={};
 AU.el.addEventListener('error',()=>{const n=AU.track;if(!n||AU.blobTried[n])return;AU.blobTried[n]=1;try{AU.el.src=URL.createObjectURL(new Blob([b64ab(PACK.bgm[n])],{type:'audio/mpeg'}));const p=AU.el.play();p&&p.catch&&p.catch(()=>{});}catch(e){}});
 for(const n of SE){try{AU.raw[n]=b64ab(PACK.se[n]);}catch(e){}}
 const sheets=Object.entries(ATLAS).map(([c,a])=>new Promise(res=>{const i=new Image();i.onload=()=>{try{for(const[n,r]of Object.entries(a.r)){const cv=document.createElement('canvas');cv.width=r[2];cv.height=r[3];cv.getContext('2d').drawImage(i,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);IMG[(a.as||c)+'/'+n]=cv.toDataURL('image/png');}}catch(e){}tick();res();};i.onerror=()=>{tick();res();};i.src=a.f;}));
 await Promise.all(sheets);
 msg.style.display='none';const sb=$('#startbtn');sb.style.display='flex';
 sb.onclick=async()=>{
  sb.onclick=null;sb.textContent='…';
  mkCtx();wake();if(AU.ctx){kick();AU.ctx.onstatechange=()=>{if(AU.ctx&&AU.ctx.state!=='running')AU.check=true;};}
  await decodeAll();
  $('#load').remove();sfx('tap');go('who');
 };
}
boot();
</script>
